<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card — ApnoAI Task 2</title>
  
  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (lets us write JSX directly in HTML) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      transition: background 0.3s ease;
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .glass-dark {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      .profile-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ============================================
    // PROFILE CARD COMPONENT
    // ============================================
    // This is a "component" — a reusable block of UI.
    // It takes "props" (properties) as input and renders output.
    // Props are like parameters to a function.
    
    function ProfileCard({ name, role, bio, skills, avatar, github, twitter, linkedin }) {
      // STATE: Data that can change
      // useState gives us a value (isDark) and a function to update it (setIsDark)
      const [isDark, setIsDark] = useState(false);
      const [isConnected, setIsConnected] = useState(false);
      const [likes, setLikes] = useState(0);

      // Toggle theme function
      const toggleTheme = () => setIsDark(!isDark);
      
      // Toggle connect button
      const toggleConnect = () => setIsConnected(!isConnected);

      return (
        <div className={`${isDark ? 'bg-gray-900' : 'bg-gradient-to-br from-purple-400 via-pink-400 to-orange-400'} min-h-screen w-full flex items-center justify-center p-4 transition-all duration-500`}>
          
          {/* Theme Toggle Button - Top Right */}
          <button
            onClick={toggleTheme}
            className="fixed top-4 right-4 p-3 rounded-full glass hover:scale-110 transition-transform z-10"
            title={isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
          >
            {isDark ? '☀️' : '🌙'}
          </button>

          {/* Main Card */}
          <div className={`${isDark ? 'glass-dark' : 'glass'} rounded-3xl p-8 max-w-md w-full shadow-2xl`}>
            
            {/* Avatar */}
            <img src="https://ui-avatars.com/api/?name=Satya+Syamala&background=random&size=150"
               alt="Profile Avatar"
              class="profile-avatar">
            <div className="flex justify-center mb-6">
              <img
                src={avatar}
                alt={name}
                className="w-32 h-32 rounded-full object-cover border-4 border-white/30 shadow-lg"
              />
            </div>

            {/* Name and Role */}
            <div className="text-center mb-6">
              <h1 className={`text-3xl font-bold mb-2 ${isDark ? 'text-white' : 'text-gray-900'}`}>
                {name}
              </h1>
              <p className={`text-lg ${isDark ? 'text-gray-300' : 'text-gray-700'}`}>
                {role}
              </p>
            </div>

            {/* Bio */}
            <p className={`text-center mb-6 leading-relaxed ${isDark ? 'text-gray-300' : 'text-gray-800'}`}>
              {bio}
            </p>

            {/* Skills */}
            <div className="flex flex-wrap gap-2 justify-center mb-6">
              {skills.map((skill, index) => (
                <span
                  key={index}
                  className={`px-3 py-1 rounded-full text-sm font-medium ${
                    isDark
                      ? 'bg-white/10 text-white border border-white/20'
                      : 'bg-white/50 text-gray-900 border border-white/30'
                  }`}
                >
                  {skill}
                </span>
              ))}
            </div>

            {/* Connect Button (Interactive - uses state!) */}
            <button
              onClick={toggleConnect}
              className={`w-full py-3 rounded-xl font-semibold mb-6 transition-all ${
                isConnected
                  ? 'bg-green-500 text-white'
                  : isDark
                  ? 'bg-white text-gray-900 hover:bg-gray-100'
                  : 'bg-gray-900 text-white hover:bg-gray-800'
              }`}
            >
              {isConnected ? '✓ Connected' : 'Connect'}
            </button>

            {/* Like Button - extra feature using React state */}
            <button
              onClick={() => setLikes(likes + 1)}
              className="w-full py-2 rounded-xl font-semibold mb-6 bg-pink-500 text-white hover:bg-pink-600 transition-all"
            >
              ❤️ Like · {likes}
            </button>

            {/* Social Links */}
            <div className="flex justify-center gap-4">
              {github && (
                <a
                  href={github}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`p-3 rounded-full transition-transform hover:scale-110 ${
                    isDark ? 'bg-white/10 text-white' : 'bg-white/50 text-gray-900'
                  }`}
                >
                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                  </svg>
                </a>
              )}
              {twitter && (
                <a
                  href={twitter}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`p-3 rounded-full transition-transform hover:scale-110 ${
                    isDark ? 'bg-white/10 text-white' : 'bg-white/50 text-gray-900'
                  }`}
                >
                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                  </svg>
                </a>
              )}
              {linkedin && (
                <a
                  href={linkedin}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`p-3 rounded-full transition-transform hover:scale-110 ${
                    isDark ? 'bg-white/10 text-white' : 'bg-white/50 text-gray-900'
                  }`}
                >
                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                  </svg>
                </a>
              )}
            </div>

            {/* Footer Credit */}
            <div className="mt-6 pt-6 border-t border-white/20 text-center">
              <p className={`text-xs ${isDark ? 'text-gray-400' : 'text-gray-700'}`}>
                Built with React 18 + Tailwind CSS · ApnoAI Task 2
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // STUDENT: CUSTOMIZE YOUR DATA HERE
    // ============================================
    // Change the values below to make this card YOURS!
    // These are called "props" — they pass data INTO the component.
    
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ProfileCard
        name="Syamala Mallipudi"
        role="B.Tech Student | Aspiring Software Developer"
        bio="I am a B.Tech student interested in software development and building useful applications. I enjoy learning Python, Java, and modern web technologies."
        skills={["Python", "Java", "HTML & CSS"]}
        avatar="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400&h=400&fit=crop&crop=face"
        github="https://github.com/satyasyamala-78"
        twitter=""
        linkedin=""
      />
    );
  </script>
</body>
</html>
